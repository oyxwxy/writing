<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>글결 — 글 꾸미기 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@300;500;800&family=Jua&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@200;400;700;900&family=Noto+Serif+KR:wght@300;500;900&display=swap" rel="stylesheet">
<style>
:root{--pan:#fff;--ws:#ebebee;--field:#f1f1f4;--fieldh:#e6e6eb;--line:#e7e7eb;--line2:#cfcfd6;--ink:#1d1d20;--mute:#86868e;--inv:#fff;--ac:#3a63e0;--acs:#3a63e01c;--segon:#fff;--segsh:0 1px 2px #00000024,0 0 0 .5px #00000012;--pop:0 0 0 .5px #00000017,0 14px 40px #0000002b;--page:0 1px 3px #00000014,0 18px 50px #00000026;--dot:#00000016;--glass:#1d1d20ec;--r:8px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--pan:#1e1e21;--ws:#141416;--field:#2a2a2f;--fieldh:#34343a;--line:#2e2e34;--line2:#45454d;--ink:#f1f1f4;--mute:#8e8e97;--inv:#17171a;--ac:#8aa5ff;--acs:#8aa5ff24;--segon:#3c3c44;--segsh:0 1px 2px #0007;--pop:0 0 0 1px #ffffff14,0 16px 44px #000000a6;--page:0 2px 8px #0006,0 24px 60px #000000b3;--dot:#ffffff10;--glass:#2c2c31f2;color-scheme:dark}}
:root[data-theme=dark]{--pan:#1e1e21;--ws:#141416;--field:#2a2a2f;--fieldh:#34343a;--line:#2e2e34;--line2:#45454d;--ink:#f1f1f4;--mute:#8e8e97;--inv:#17171a;--ac:#8aa5ff;--acs:#8aa5ff24;--segon:#3c3c44;--segsh:0 1px 2px #0007;--pop:0 0 0 1px #ffffff14,0 16px 44px #000000a6;--page:0 2px 8px #0006,0 24px 60px #000000b3;--dot:#ffffff10;--glass:#2c2c31f2;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/1.45 'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;letter-spacing:-.01em;color:var(--ink);background:var(--ws);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:var(--field);border:0;border-radius:var(--r);padding:7px 10px;cursor:pointer;transition:background-color .12s,color .12s,box-shadow .12s,opacity .12s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button:hover{background:var(--fieldh)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ink);color:var(--inv);font-weight:600}button.pri:hover{background:var(--ink);opacity:.86}
button.on{background:var(--acs);color:var(--ac);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,textarea{font:inherit;letter-spacing:inherit;color:var(--ink);background:var(--field);border:0;border-radius:var(--r);transition:box-shadow .12s,background-color .12s}
input:focus,textarea:focus{outline:0;background:var(--pan);box-shadow:inset 0 0 0 1.5px var(--ac)}
input::placeholder,textarea::placeholder{color:var(--mute)}
[data-st],[data-ma^="gmv"],[data-ma^="gsz"],[data-a="zo"],[data-a="zi"],[data-a="s-"],[data-a="s+"],[data-a="x-"],[data-a="x+"],[data-ie^="adj"]{touch-action:none}

/* 상단 바 */
header{height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 10px 0 16px;background:var(--pan);border-bottom:1px solid var(--line);overflow-x:auto;position:relative;z-index:3}
header::-webkit-scrollbar{height:0}
header button{background:transparent;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px}
header button:hover,header button.on,header .mb.on{background:var(--field);color:var(--ink);box-shadow:none}
header button.pri{background:var(--ink);color:var(--inv);padding:0 14px 0 12px;margin-left:4px}
header .ib{width:34px;padding:0;justify-content:center}
.hl{display:flex;align-items:center;gap:6px;min-width:0;flex:none}
.lg{font-weight:800;font-size:17px;letter-spacing:-.05em;margin-right:2px}
.hl .dt{color:var(--mute);font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;display:block;line-height:30px;height:30px;padding:0 8px}
.hl .dt:hover{color:var(--ink)}
.vr{width:1px;height:18px;background:var(--line2);opacity:.6;margin:0 8px;flex:none}
.sp{flex:1;min-width:8px}
#sv{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-right:8px;flex:none}
#sv::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
header .sh{display:none}header .sub{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.mb::after{content:"";width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.45;margin-left:1px}

/* 왼쪽 패널 */
main{flex:1;display:flex;min-height:0}
aside{width:360px;flex:none;background:var(--pan);border-right:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto 1fr;min-height:0;position:relative;z-index:2}
.grab{display:none}
.rail{grid-row:1/3;grid-column:1;display:flex;flex-direction:column;gap:2px;padding:10px 7px;border-right:1px solid var(--line)}
.rail button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 8px;font-size:11px;color:var(--mute);border-radius:10px}
.rail button .i{width:20px;height:20px;color:var(--ink)}
.rail button:hover{background:var(--field);color:var(--ink)}
.tabs{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:12px 14px 0;padding:3px;background:var(--field);border-radius:10px}
.tabs button{background:transparent;padding:7px 0;color:var(--mute);font-weight:600;border-radius:7px}
.tabs button:hover{color:var(--ink);background:transparent}
.tabs button.on{background:var(--segon);color:var(--ink);box-shadow:var(--segsh)}
#pn{grid-column:2;overflow:auto;padding:18px 14px 40px;min-height:0}
#pn h3{font-size:15px;font-weight:700;letter-spacing:-.025em;margin-bottom:2px}
.hint{color:var(--mute);font-size:12px;line-height:1.55;margin:3px 0 10px}
textarea{width:100%;min-height:120px;padding:11px 12px;resize:vertical;line-height:1.7;display:block}
.row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.row>*{flex:1;white-space:nowrap}
.sec{margin:20px -14px 10px;padding:16px 14px 0;border-top:1px solid var(--line);font-weight:650;font-size:12.5px;letter-spacing:-.015em}
.sec small{color:var(--mute);font-weight:400}

/* 묶음 버튼 (세그먼트) */
.grid4,.g5,.mg,.sg3{display:grid;gap:2px;padding:3px;background:var(--field);border-radius:10px}
.grid4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.mg{grid-template-columns:1fr 1fr}.sg3{grid-template-columns:repeat(3,1fr)}
.grid4 button,.g5 button,.mg button,.sg3 button{background:transparent;padding:7px 0;font-size:12.5px;border-radius:7px;box-shadow:none;color:var(--ink)}
.grid4 button:hover,.g5 button:hover,.mg button:hover,.sg3 button:hover{background:var(--fieldh)}
.grid4 button.on,.g5 button.on,.mg button.on,.sg3 button.on{background:var(--segon);color:var(--ink);box-shadow:var(--segsh);font-weight:600}

/* 숫자 칸 */
.nv{display:grid;grid-template-columns:58px 30px 1fr 30px;gap:1px;align-items:center;margin:5px 0}
.nv span{color:var(--mute);font-size:12px;cursor:ew-resize;user-select:none;touch-action:none;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv span:hover{color:var(--ink)}
.nv button{padding:0;height:30px;border-radius:0;color:var(--mute);font-size:15px;line-height:1}
.nv button:hover{color:var(--ink)}
.nv button:first-of-type{border-radius:8px 0 0 8px}.nv button:last-of-type{border-radius:0 8px 8px 0}
.nv input,.gs{min-width:0;width:100%;height:30px;border-radius:0;padding:0 4px;text-align:center;font-variant-numeric:tabular-nums}
.sw{width:100%;height:36px;display:flex;align-items:center;gap:9px;padding:0 10px;text-align:left}
.sw i{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px #0000002e;flex:none}

/* 작업 공간 */
#wsw{flex:1;position:relative;min-width:0;display:flex}
#ws{flex:1;overflow:auto;display:flex;padding:72px 40px 84px;background:var(--ws);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px}
#cv{margin:auto;box-shadow:var(--page);background:#fff;touch-action:none;display:block;flex:none}
#fb{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-radius:12px;padding:4px;display:none;gap:1px;align-items:center;z-index:5;box-shadow:0 0 0 .5px #ffffff1a,0 10px 30px #00000040;color:#f4f4f6}
#fb button{background:transparent;color:#f4f4f6;padding:0 10px;height:32px;min-width:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;flex:none}
#fb button:hover{background:#ffffff1f}
#fb button .i{width:17px;height:17px}
#fb u{width:1px;height:18px;background:#ffffff2b;margin:0 4px;flex:none}
#fb .c{width:20px;height:20px;min-width:0;height:20px;border-radius:50%;padding:0;margin:0 6px;box-shadow:0 0 0 2px #fff,0 0 0 3px #0005}
#fb .gt{color:#ffffffb0;padding:0 8px 0 8px;font-size:12px;white-space:nowrap}
#zm{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pan);border-radius:12px;padding:3px;display:flex;align-items:center;gap:1px;box-shadow:var(--pop);z-index:4}
#zm button{background:transparent;height:30px;min-width:30px;padding:0 10px}#zm button:hover{background:var(--field)}
#zm span{min-width:46px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute)}
#cb{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--pan);border-radius:12px;padding:6px 6px 6px 14px;display:none;gap:10px;align-items:center;z-index:5;box-shadow:var(--pop);white-space:nowrap}
#cb label{display:flex;align-items:center;gap:6px;color:var(--mute)}#cb input{width:76px;padding:6px;text-align:center}
#tip{position:absolute;z-index:7;display:none;pointer-events:none;background:var(--glass);color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:5px 9px;border-radius:7px;white-space:nowrap;box-shadow:0 6px 16px #0003}
#ed{position:absolute;display:none;z-index:6;margin:0;padding:0;border:0;border-radius:0;outline:1.5px dashed var(--ac);outline-offset:8px;background:transparent!important;box-shadow:none!important;color:transparent;caret-color:#3a63e0;resize:none;overflow:hidden;white-space:pre;min-height:0;transform-origin:center center}
#ed::selection{background:#3a63e055;color:transparent}

/* 팝오버 · 메뉴 */
#pop{position:fixed;z-index:20;background:var(--pan);border-radius:14px;box-shadow:var(--pop);padding:10px;display:none;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:auto}
.dl{max-height:340px;overflow:auto;min-width:220px;margin:-4px;display:flex;flex-direction:column;gap:1px}
.dl button{background:transparent;text-align:left;font-size:16px;padding:8px 10px}
.dl button:hover{background:var(--field)}.dl button.on{background:var(--acs);color:var(--ac);box-shadow:none}
.mn{width:276px;display:flex;flex-direction:column;gap:6px}
.mn .mh{font-size:11.5px;font-weight:650;color:var(--mute);margin-top:10px}.mn .mh:first-child{margin-top:2px}
.mn hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.mi{background:transparent;text-align:left;padding:9px 10px}.mi:hover{background:var(--field)}.mi.dg,.dgb{color:#d63c31}
.gls{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.gl{display:grid;grid-template-columns:34px 30px 1fr 30px auto;gap:1px;align-items:center;padding:2px 4px;border-radius:9px}
.gl.on{background:var(--acs)}
.gl>span{color:var(--mute);font-size:12px}.gl>span:last-child{padding-left:6px}
.gl>button,.gl>input{height:30px;border-radius:0;padding:0}
.gl>button:nth-child(2){border-radius:8px 0 0 8px}.gl>button:nth-child(4){border-radius:0 8px 8px 0}
.gl>button:nth-child(5){border-radius:8px;margin-left:6px;padding:0 10px}
.gl input{min-width:0;width:100%;text-align:center;font-variant-numeric:tabular-nums}
.mto{display:none}
.cp{width:232px}
.sv{height:150px;border-radius:9px;position:relative;touch-action:none;cursor:crosshair}
.sv i,.hu i{position:absolute;width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px #0006,0 2px 6px #0004;transform:translate(-50%,-50%);pointer-events:none}
.hu{height:12px;border-radius:6px;margin:12px 0;position:relative;touch-action:none;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}.hu i{top:6px}
.cp input{width:100%;padding:7px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;letter-spacing:0}
.cp>button[data-n]{width:100%;margin-top:8px}
.rc{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.rc small{width:100%;color:var(--mute);font-size:11.5px}
.rc button{width:22px;height:22px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1px #00000029;transition:transform .1s}
.rc button:hover{transform:scale(1.12)}
.rc button.on{box-shadow:0 0 0 2px var(--pan),0 0 0 3.5px var(--ink)}
.syw{width:min(316px,calc(100vw - 40px))}.sya{max-height:min(380px,55vh);max-height:min(380px,55dvh);overflow:auto;margin-top:6px}.syh{position:sticky;top:0;background:var(--pan);font-size:11.5px;font-weight:650;color:var(--mute);padding:8px 2px 4px;z-index:1}
.sy{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.sy button{background:transparent;padding:6px 0;font-size:17px}.sy button:hover{background:var(--field)}

/* 레이어 */
#lp{position:fixed;right:16px;top:68px;width:260px;max-height:60vh;background:var(--pan);border-radius:14px;box-shadow:var(--pop);display:none;flex-direction:column;z-index:15;overflow:hidden}
#lp .lh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);cursor:move;user-select:none}#lp .lh b{font-size:13px}
#lp .lh button{background:transparent;padding:5px 9px;color:var(--mute)}#lp .lh button:hover{background:var(--field);color:var(--ink)}
#ll{overflow:auto;padding:6px}
.ly{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}.ly:hover{background:var(--field)}.ly.on{background:var(--acs)}
.ly .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly button{background:transparent;padding:2px 6px;font-size:11px;color:var(--mute)}.ly button:hover{background:var(--fieldh);color:var(--ink)}
.gb{width:4px;align-self:stretch;border-radius:2px;flex:none}

/* 스크롤바 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:content-box;min-height:36px}
::-webkit-scrollbar-thumb:hover{background:var(--mute);background-clip:content-box}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}}

/* 모달 */
#ie,#md{position:fixed;inset:0;z-index:40;background:#0000004a;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.mdp{background:var(--pan);border-radius:16px;width:min(760px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--pop)}
.mdh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}.mdh b{font-size:16px;letter-spacing:-.025em}
.mdh button{background:transparent;color:var(--mute)}.mdh button:hover{background:var(--field);color:var(--ink)}
.mdc{overflow:auto;padding:16px 18px 20px}
.vs{display:flex;gap:6px;flex-wrap:wrap}.vs input{flex:1 1 200px;min-width:0;padding:8px 12px}
.vl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.vc{border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--field)}
.vc.on{box-shadow:0 0 0 2px var(--ac)}
.vc img{width:100%;aspect-ratio:4/5;object-fit:contain;background:var(--ws);display:block}
.vm{padding:10px 12px 2px;display:flex;flex-direction:column;gap:2px;min-width:0}.vm b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vm small{color:var(--mute);font-size:11px}
.vb{display:flex;gap:4px;padding:8px 10px 10px}.vb button{flex:1;padding:6px 0;background:var(--pan)}.vb button:hover{background:var(--fieldh)}.vb .pri{flex:2;background:var(--ink)}
.iep{background:var(--pan);border-radius:16px;width:min(1100px,100%);height:min(780px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--pop)}
.ieh{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}.ieh b{font-size:15px;letter-spacing:-.02em}.ieh .sp{flex:1}
.ieb{flex:1;display:flex;min-height:0}
.iev{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--ws);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;overflow:hidden}
#iec{display:block;touch-action:none;box-shadow:var(--page)}
.iec{width:320px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:16px 14px 28px}
.iec .sec:first-child{border-top:0;padding-top:0;margin-top:0}

/* 모바일 */
@media (max-width:760px){
 body{height:100dvh}
 header{height:auto;min-height:50px;padding:env(safe-area-inset-top) 8px 0;gap:1px}
 header .lb,#sv,.hl,.dto{display:none}header .sh{display:inline}
 header .mb::after{display:none}
 header button{padding:0 9px}
 header button.pri{padding:0 12px 0 10px}
 .vr{margin:0 4px}
 .mto{display:block}
 main{flex-direction:column}
 #wsw{order:1;min-height:0}
 aside{order:2;width:100%;height:46vh;height:46dvh;display:flex;flex-direction:column;border-right:0;border-top:1px solid var(--line);box-shadow:0 -10px 30px #00000014;border-radius:16px 16px 0 0;margin-top:-12px;padding-bottom:env(safe-area-inset-bottom)}
 aside.min{height:auto}aside.min #pn{display:none}
 .grab{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:transparent;padding:9px 0 3px;color:var(--mute);font-size:11px;border-radius:16px 16px 0 0}
 .grab:hover{background:transparent}
 .grab i{width:36px;height:4px;border-radius:2px;background:var(--line2)}
 .rail{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 10px 6px;border-right:0;gap:2px}
 .rail button{padding:7px 0 6px}
 .tabs{margin:4px 12px 0}
 #pn{padding:14px 12px 24px}
 #pn .sec{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
 #pn button,.mn button{min-height:36px}
 input,textarea{font-size:16px!important}
 .nv{grid-template-columns:56px 40px 1fr 40px}.nv button,.nv input{height:36px}
 .gl{grid-template-columns:34px 38px 1fr 38px auto}.gl>button,.gl>input{height:36px}
 .grid4 button,.g5 button,.mg button,.sg3 button{padding:9px 0}
 #ws{padding:20px 12px 70px}
 #fb{top:8px;max-width:calc(100% - 16px);overflow-x:auto}#fb button{height:34px;padding:0 8px}
 #cb{top:8px;left:8px;right:8px;transform:none;flex-wrap:wrap;white-space:normal;gap:8px}#cb .hint{display:none}
 #lp{left:8px!important;right:8px;top:calc(58px + env(safe-area-inset-top))!important;width:auto;max-height:40vh}
 .rc button{width:28px;height:28px}
 .cp{width:min(260px,calc(100vw - 44px))}
